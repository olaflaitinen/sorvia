[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sorvia"
version = "1.0.0"
description = "Natural-language (Azerbaijani) to safe SQL platform with database-enforced guardrails and a self-tuning index advisor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Sorvia contributors" }]
keywords = ["text-to-sql", "postgresql", "row-level-security", "index-advisor", "azerbaijani", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Database",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.9"]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
sorvia = "sorvia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sorvia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL database (SORVIA_TEST_ADMIN_DSN)"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "benchmark", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S608",   # SQL is built from validated identifiers via psycopg.sql
    "RUF001", "RUF002", "RUF003",  # Azerbaijani letters are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/sorvia/seed/**" = ["S311"]
"experiments/**" = ["S311", "S603", "T201"]
"benchmark/build_dataset.py" = ["E501"]
"src/sorvia/seed/catalog.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sorvia"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sqlglot.*"]
ignore_missing_imports = true
